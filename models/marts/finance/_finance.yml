version: 2

models:
  - name: fct_mrr_monthly
    description: >
      Monthly MRR waterfall per customer: new, expansion, contraction,
      churned, and reactivation MRR movements, plus the resulting mrr_usd
      balance for that month.
    columns:
      - name: customer_id
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null

  - name: fct_invoices
    description: One row per invoice with amount collected and days-past-due.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null

  - name: fct_payments
    description: One row per payment attempt, enriched with invoice status.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
