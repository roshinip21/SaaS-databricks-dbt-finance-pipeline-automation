name: 'saas_analytics'
version: '1.0.0'
config-version: 2

profile: 'saas_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  trailing_12_months_start: "{{ (modules.datetime.date.today() - modules.datetime.timedelta(days=365)).isoformat() }}"

seeds:
  saas_analytics:
    +schema: seed
    +quote_columns: false
    customers:
      +column_types:
        signup_date: date
    plans:
      +column_types:
        price_usd: decimal(10,2)
    subscriptions:
      +column_types:
        start_date: date
        end_date: date
        mrr_usd: decimal(10,2)
    subscription_events:
      +column_types:
        event_date: date
        mrr_delta_usd: decimal(10,2)
    invoices:
      +column_types:
        invoice_date: date
        due_date: date
        period_start: date
        period_end: date
        amount_usd: decimal(10,2)
    payments:
      +column_types:
        payment_date: date
        amount_usd: decimal(10,2)
    usage_events:
      +column_types:
        event_timestamp: timestamp
    support_tickets:
      +column_types:
        created_at: timestamp
        resolved_at: timestamp

models:
  saas_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
